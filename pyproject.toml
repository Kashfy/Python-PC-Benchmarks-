[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbench"
version = "3.0"
description = "Cross-platform PC benchmark and diagnostics tool"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Kashfy" }]
keywords = ["benchmark", "diagnostics", "hardware", "performance", "cpu",
            "memory", "disk", "thermal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Hardware",
]
# No required runtime dependencies: the tool must run on a bare interpreter.
dependencies = []

[project.optional-dependencies]
# Slightly richer hardware detection; the tool falls back to native OS probes.
extras = ["psutil>=5.9"]

[project.scripts]
pcbench = "pcbench.cli:entry"

[project.urls]
Homepage = "https://github.com/kashfygazi/Python-PC-Benchmarks-"

[tool.setuptools]
packages = ["pcbench"]
